# Framework pack — APRA Prudential Standard CPS 234 (Information Security).
# Maps OUR capabilities (resops/assurance/capabilities.py) to CPS 234 requirement areas.
#
# Why this sits alongside CPS 230 rather than replacing it: 230 is operational risk
# ("can this critical operation keep running, within tolerance"), 234 is information
# security ("are these information assets protected, and can you show the controls
# work"). A compromised-recovery-point question touches both — 230 asks whether you
# recover in time, 234 asks whether what you recovered is trustworthy.
#
# References are by topic area, not exact paragraph numbers, to stay honest.
# INDICATIVE — supports an internal resilience programme, not an attestation.
id: apra-cps234
name: "APRA CPS 234 (Information Security)"
disclaimer: "Indicative APRA CPS 234 mapping — supports a resilience programme, not a compliance attestation."
references:
