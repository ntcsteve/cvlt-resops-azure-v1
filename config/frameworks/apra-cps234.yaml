  CAP-BACKUP-COVERAGE: "CPS 234 — controls proportionate to asset criticality & sensitivity"
  CAP-BACKUP-MONITORING: "CPS 234 — detection of information security incidents"
  CAP-RECOVERY-POINT-TRUST: "CPS 234 — integrity of information assets; incident response"
  CAP-RECOVERY-READINESS: "CPS 234 — response & recovery capability"
  CAP-RESTORE-TESTED: "CPS 234 — systematic testing of control effectiveness"
  CAP-EVIDENCE-TRAIL: "CPS 234 — internal audit review of control design & effectiveness"
  CAP-GOVERNED-CHANGE: "CPS 234 — Board accountability for information security"
