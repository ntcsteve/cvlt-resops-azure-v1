<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 278" width="960" height="278" role="img" aria-label="Two loops. Delivery: code, build, deploy, observe, respond, already gated by tests, scans, lint and plan. Recovery: discover, protect, detect, recover, scan, validate, gated by one required check that exits 0 or 1 on every change.">
  <!-- Colors mirror tools/guide/assets/tokens.css: crocus #844896 on
       the row kickers, the yes shade #30881c on the fourth gate,
       muted #707391, ink #00053b, fog #eaeaea. Change them there
       first. -->
  <rect width="960" height="278" fill="#ffffff"/>
<text x="40" y="51" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#844896">DELIVERY</text>
<rect x="150" y="24" width="136" height="44" rx="6" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
<text x="218" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#00053b">Code</text>
<rect x="310" y="24" width="136" height="44" rx="6" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
<text x="378" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#00053b">Build</text>
<line x1="289" y1="46" x2="302" y2="46" stroke="#707391" stroke-width="1.2"/>
<path d="M 302 42 L 309 46 L 302 50 Z" fill="#707391"/>
<rect x="470" y="24" width="136" height="44" rx="6" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
<text x="538" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#00053b">Deploy</text>
<line x1="449" y1="46" x2="462" y2="46" stroke="#707391" stroke-width="1.2"/>
<path d="M 462 42 L 469 46 L 462 50 Z" fill="#707391"/>
<rect x="630" y="24" width="136" height="44" rx="6" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
<text x="698" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#00053b">Observe</text>
<line x1="609" y1="46" x2="622" y2="46" stroke="#707391" stroke-width="1.2"/>
<path d="M 622 42 L 629 46 L 622 50 Z" fill="#707391"/>
<rect x="790" y="24" width="136" height="44" rx="6" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
<text x="858" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#00053b">Respond</text>
