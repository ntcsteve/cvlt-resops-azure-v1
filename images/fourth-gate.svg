<text x="540" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#707391">gated already: tests, security scans, lint, infrastructure plan</text>
<text x="40" y="169" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#844896">RECOVERY</text>
<rect x="150" y="142" width="110" height="44" rx="6" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
<text x="205" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#00053b">Discover</text>
<rect x="284" y="142" width="110" height="44" rx="6" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
