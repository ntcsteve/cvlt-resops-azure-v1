<path d="M 678 160 L 685 164 L 678 168 Z" fill="#707391"/>
<rect x="820" y="142" width="110" height="44" rx="6" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
<text x="875" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#00053b">Validate</text>
<line x1="799" y1="164" x2="812" y2="164" stroke="#707391" stroke-width="1.2"/>
<path d="M 812 160 L 819 164 L 812 168 Z" fill="#707391"/>
<path d="M 150 196 L 150 205 L 930 205 L 930 196" fill="none" stroke="#30881c" stroke-width="1.5"/>
<text x="540" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#30881c">the fourth gate: one required check, exit 0 or 1, on every change</text>
</svg>
