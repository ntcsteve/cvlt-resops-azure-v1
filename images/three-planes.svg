<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400"
     width="960" height="400" role="img"
     aria-label="The three planes: production, recovery, isolated. The attacker reaches the workload and never the copies.">
  <!-- Colors mirror tools/guide/assets/tokens.css: ink #00053b, line #eaeaea,
       crocus #844896 (kicker role), rose AA shade #db2961 (the X, a verdict),
       muted #707391. Icons: official Commvault set, Midnight variant. -->
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="150" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="1" fill="#844896">PRODUCTION PLANE</text>
  <rect x="30" y="66" width="240" height="216" rx="8" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
  <image x="128" y="86" width="44" height="44" href="data:image/svg+xml;base64,"/>
  <text x="150" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#00053b">your VM</text>
  <text x="150" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">no public IP</text>
  <text x="150" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">no open ports</text>
  <text x="150" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">no way to log in</text>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="1" fill="#844896">RECOVERY PLANE</text>
  <rect x="360" y="66" width="240" height="216" rx="8" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
  <image x="458" y="86" width="44" height="44" href="data:image/svg+xml;base64,"/>
  <text x="480" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#00053b">AIR GAP PROTECT</text>
  <text x="480" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">immutable copies</text>
  <text x="480" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">service-held keys</text>
  <text x="480" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">nothing reaches back</text>
  <text x="810" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="1" fill="#844896">ISOLATED PLANE</text>
  <rect x="690" y="66" width="240" height="216" rx="8" fill="#ffffff" stroke="#eaeaea" stroke-width="1.5"/>
  <image x="788" y="86" width="44" height="44" href="data:image/svg+xml;base64,"/>
  <text x="810" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#00053b">restored copy</text>
  <text x="810" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">verified from</text>
  <text x="810" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">the inside,</text>
  <text x="810" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">then deleted</text>
  <line x1="270" y1="174" x2="348" y2="174" stroke="#00053b" stroke-width="1.5"/><path d="M 348 169 L 360 174 L 348 179 Z" fill="#00053b"/><text x="315" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#707391">agent</text><text x="315" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#707391">snapshot</text>
  <line x1="600" y1="174" x2="678" y2="174" stroke="#00053b" stroke-width="1.5"/><path d="M 678 169 L 690 174 L 678 179 Z" fill="#00053b"/><text x="645" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#707391">restore</text><text x="645" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#707391">drill</text>
  <line x1="150" y1="336" x2="150" y2="290" stroke="#db2961" stroke-width="1.5"/>
  <path d="M 145 294 L 150 282 L 155 294 Z" fill="#db2961"/>
  <text x="150" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14"
        font-weight="bold" fill="#00053b">attacker</text>
  <line x1="196" y1="350" x2="440" y2="350" stroke="#db2961" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="458" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold"
        fill="#db2961">&#10007;</text>
  <text x="482" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707391">no
    path from the VM to the copies, ever</text>
</svg>
