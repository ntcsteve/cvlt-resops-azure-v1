<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 175" width="960" height="175" role="img" aria-label="Four verdicts over two hours: PROMOTE, then HOLD after a backup, then HOLD after something looked inside, then PROMOTE after re-proving it.">
  <!-- Colors mirror tools/guide/assets/tokens.css: the yes shade
       #30881c on #f3faf1, the no shade #db2961 on #fdf2f5, muted
       #707391, ink #00053b. Change them there first. (A CSS variable
       name cannot appear here: XML forbids a double hyphen inside a
       comment.) -->
  <rect width="960" height="175" fill="#ffffff"/>
  <rect x="70" y="40" width="130" height="56" rx="28" fill="#f3faf1" stroke="#30881c" stroke-width="1.5"/><text x="135" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#30881c">PROMOTE</text><text x="135" y="118" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#707391">op gate</text>
  <rect x="300" y="40" width="130" height="56" rx="28" fill="#fdf2f5" stroke="#db2961" stroke-width="1.5"/><text x="365" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#db2961">HOLD</text><text x="365" y="118" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#707391">op gate</text>
  <rect x="530" y="40" width="130" height="56" rx="28" fill="#fdf2f5" stroke="#db2961" stroke-width="1.5"/><text x="595" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#db2961">HOLD</text><text x="595" y="118" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#707391">op threatscan</text>
  <rect x="760" y="40" width="130" height="56" rx="28" fill="#f3faf1" stroke="#30881c" stroke-width="1.5"/><text x="825" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#30881c">PROMOTE</text><text x="825" y="118" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#707391">op gate</text>
  <line x1="200" y1="68" x2="289" y2="68" stroke="#00053b" stroke-width="1.5"/><path d="M 289 63 L 300 68 L 289 73 Z" fill="#00053b"/><text x="250" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#00053b">you took</text><text x="250" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#00053b">a backup</text>
  <line x1="430" y1="68" x2="519" y2="68" stroke="#00053b" stroke-width="1.5"/><path d="M 519 63 L 530 68 L 519 73 Z" fill="#00053b"/><text x="480" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#00053b">something</text><text x="480" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#00053b">looked inside</text>
  <line x1="660" y1="68" x2="749" y2="68" stroke="#00053b" stroke-width="1.5"/><path d="M 749 63 L 760 68 L 749 73 Z" fill="#00053b"/><text x="710" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#00053b">you</text><text x="710" y="154" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#00053b">re-proved it</text>
</svg>
