#cloud-config
# Stands up the stack defined in ./stack/ – this file EMBEDS those artifacts
# rather than restating them, so `test-stack.sh` running the same compose file
# locally proves something about what actually deploys.
#
#   pushgateway :9091   `resops metrics` POSTs here. A batch job publishing its
#                       result is what pushgateway is FOR – not the "don't use
#                       it for scraping" anti-pattern.
#   prometheus  :9090   scrapes localhost only. no service discovery, no cloud
#                       credentials, no network path to a protected workload.
#   grafana     :3000   datasource and dashboards provisioned from files.
#
# STATELESS. No volumes: destroy the VM and nothing is lost, because every number
# is derived from evidence that lives in the repo. Rebuild is one apply.

package_update: true
packages:
  - docker.io
  - docker-compose-v2

write_files:
  # Compose reads GRAFANA_PASSWORD from a .env beside it – the same mechanism
  # test-stack.sh uses locally, so the compose file needs no VM-only variant.
  - path: /opt/obs/.env
    permissions: "0600"
    content: |
      GRAFANA_PASSWORD=${grafana_password}

  - path: /opt/obs/docker-compose.yml
    permissions: "0644"
    content: |
      ${compose_yml}

  - path: /opt/obs/prometheus.yml
    permissions: "0644"
    content: |
      ${prometheus_yml}

  - path: /opt/obs/grafana-datasource.yml
    permissions: "0644"
    content: |
      ${datasource_yml}

  - path: /opt/obs/grafana-dashboards.yml
    permissions: "0644"
    content: |
      ${dashboards_yml}

  - path: /opt/obs/dashboards/resops.json
    permissions: "0644"
    content: |
      ${dashboard_json}

runcmd:
  - systemctl enable --now docker
  - docker compose -f /opt/obs/docker-compose.yml up -d
  # A marker so `az vm run-command` can confirm the stack without a browser.
  - sh -c 'sleep 25; docker compose -f /opt/obs/docker-compose.yml ps > /opt/obs/STATUS 2>&1'
