#cloud-config
# A deliberately small service, laid down so the workload has something to LOSE.
#
# A bare OS image cannot be trust-mapped and gives a threat scan nothing to find.
# The workshop's first exercise asks participants to mark each part of a service
# as trusted, untrusted or unknown — so the VM ships with exactly four things to
# mark, each a different trust question:
#
#   /opt/app/         the code        did this come from the pipeline?
#   /var/lib/app/     the state       it changed after the deploy — is that expected?
#   /etc/app/config.yml  the config   who can write this?
#   /etc/app/creds.env   the secret   this is the blast radius
#
# No containers, no orchestration, no inbound ports. It writes a heartbeat so the
# state genuinely changes over time, which is what makes "when did this last look
# right?" a real question rather than a hypothetical one.

write_files:
  - path: /etc/app/config.yml
    permissions: "0644"
    content: |
      # Service configuration. World-readable on purpose: in the workshop this is
      # the "who can write this?" conversation.
      service: ${workload_name}
      listen: 127.0.0.1:8080
      data_dir: /var/lib/app/data
      heartbeat_seconds: 30

  - path: /etc/app/creds.env
    permissions: "0600"
    content: |
      # NOT A REAL CREDENTIAL. Placeholder so the trust-map exercise has a secret
      # to reason about — the scenario is a credential with broad access being
      # misused, and this is the thing participants point at when asked "what is
      # the blast radius?". Never put a live secret here.
      APP_STORAGE_KEY=demo-not-a-real-key-0000000000000000
      APP_DB_PASSWORD=demo-not-a-real-password

  - path: /opt/app/serve.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # The "application". Appends a heartbeat and keeps a small ledger, so the
      # workload has state that moves. Boring on purpose.
      set -euo pipefail
      DATA_DIR=/var/lib/app/data
      mkdir -p "$DATA_DIR"
      while true; do
        date -u +"%Y-%m-%dT%H:%M:%SZ heartbeat ok" >> "$DATA_DIR/service.log"
        printf '{"order":"%s","status":"settled","amount":%s}\n' \
          "$(date -u +%s)" "$((RANDOM % 500 + 20))" >> "$DATA_DIR/orders.ndjson"
        sleep 30
      done

  - path: /opt/app/verify.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # WHAT "GOOD" LOOKS LIKE, declared by the workload that owns it.
      #
      # The drill restores a recovery point into isolation and runs this INSIDE the
      # restored copy. The OK:/FAIL: line it prints is the attestation — a
      # human-readable set of checks that actually ran on the actual data. Nothing
      # infers, nothing samples, nothing guesses from metadata — it opens the box
      # and looks. (The drill parses that line, not the exit code; keep the two in
      # agreement and keep every message on ONE line. Contract: VERIFY.md.)
      #
      # This is the only attester we own end to end, and the only one that can
      # say YES. It is not the only one that works. On 2026-08-12 the vendor's
      # threat scan found two planted EICAR files in this VM's backup and missed
      # fourteen encrypted ones; this script found the fourteen and never saw the
      # two. Neither is sufficient alone, which is the argument for both.
      # Dedupe ratio was tried and killed: 40+ points of variance on an idle VM.
      #
      # Every team writes their own. Ours checks four things.
      set -uo pipefail
      DATA=/var/lib/app/data
      fail() { echo "FAIL: $*"; exit 1; }

      # 1. the code came back
      [ -x /opt/app/serve.sh ] || fail "/opt/app/serve.sh missing or not executable"
      [ -s /opt/app/VERSION ]  || fail "/opt/app/VERSION missing"

      # 2. the known-good marker survived — "what did we still trust?"
      # Keep every fail message on ONE line: the drill reads the first FAIL: line
      # as the attestation detail, so a wrapped message is silently truncated.
      [ -s "$DATA/BASELINE" ] || fail "BASELINE marker missing — no known-good state in this recovery point"

      # 3. the records are actually readable, not just present
      [ -s "$DATA/customers.csv" ] || fail "customers.csv missing — records lost"
      rows=$(($(wc -l < "$DATA/customers.csv") - 1))
      [ "$rows" -ge 1 ] || fail "customers.csv has no data rows"
      head -1 "$DATA/customers.csv" | grep -q '^customer,' \
        || fail "customers.csv header is corrupt — not the schema we expect"

      # 4. nothing that signals an encryption event
      locked=$(find "$DATA" -name '*.locked' | wc -l)
      [ "$locked" -eq 0 ] || fail "$locked encrypted (.locked) files present"
      [ ! -f "$DATA/README_RECOVER.txt" ] || fail "ransom note present"

      # 5. can this recovery point ACCEPT and RETURN data, or only hold it?
      # Checks 1-4 all ask "is the right data here?". None of them asks "does the
      # store still WORK?" — and a read-only mount, a full disk or a half-restored
      # filesystem passes every check above, then fails a real service on its very
      # first write. So: write a record, read it back, compare it, remove it. A
      # synthetic transaction, executed INSIDE the recovery point.
      #
      # THIS DOES NOT PROVE THE APPLICATION WORKS. It proves the datastore accepts
      # a write and returns the same bytes. Claiming more would make this script
      # the thing it exists to catch.
      probe="$DATA/.verify-probe.$$"
      token="resops-probe-$$"
      # Braces, not `echo ... 2>/dev/null`: the redirect itself is what fails on a
      # read-only store, and the shell reports THAT on its own stderr before echo
      # ever runs. Redirecting echo's stderr does not suppress it. parse_verdict
      # ignores non-verdict lines so it would still work, but a raw
      # "Permission denied" printed above the FAIL: line is precisely the noise
      # this script exists not to produce.
      { echo "$token" > "$probe"; } 2>/dev/null \
        || fail "data store not writable — the recovery point cannot accept a transaction"
      readback=$(cat "$probe" 2>/dev/null) \
        || { rm -f "$probe"; fail "data store not readable — wrote a record, could not read it back"; }
      rm -f "$probe"
      [ "$readback" = "$token" ] \
        || fail "write/read mismatch in the data store — it returned different bytes"

      echo "OK: code intact, baseline present, $rows customer records, no encryption markers, write/read verified"
      exit 0

  - path: /etc/systemd/system/resops-demo.service
    permissions: "0644"
    content: |
      [Unit]
      Description=ResOps workshop demo service (${workload_name})
      After=network.target

      [Service]
      Type=simple
      EnvironmentFile=/etc/app/creds.env
      ExecStart=/opt/app/serve.sh
      Restart=always

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Seed a known-good baseline BEFORE the service starts, so there is state that
  # predates any incident. This is what "the last point we trusted" refers to.
  - mkdir -p /var/lib/app/data /opt/app
  - echo "customer,tier,region"                        > /var/lib/app/data/customers.csv
  - echo "acme,gold,apac"                             >> /var/lib/app/data/customers.csv
  - echo "globex,silver,emea"                         >> /var/lib/app/data/customers.csv
  - echo "initech,gold,amer"                          >> /var/lib/app/data/customers.csv
  - date -u +"%Y-%m-%dT%H:%M:%SZ known-good baseline" > /var/lib/app/data/BASELINE
  - echo "${workload_name} v1.0.0"                     > /opt/app/VERSION
  - systemctl daemon-reload
  - systemctl enable --now resops-demo.service
